<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди звезду</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
overflow:hidden;
height:100vh;
color:white;
}

#stars{
position:fixed;
width:100%;
height:100%;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:.6;
animation:blink 3s infinite alternate;
}

@keyframes blink{
from{opacity:.2;}
to{opacity:1;}
}

.special{

width:8px;
height:8px;
background:#8fd8ff;
box-shadow:
0 0 12px #38BDF8,
0 0 25px #38BDF8,
0 0 45px white;

cursor:pointer;

animation:glow 2s infinite alternate;

}

@keyframes glow{

from{
transform:scale(1);
}

to{
transform:scale(1.5);
}

}

.center{

position:absolute;

left:50%;

top:15%;

transform:translateX(-50%);

text-align:center;

z-index:10;

}

h1{

font-size:42px;

margin-bottom:15px;

}

p{

font-size:20px;

color:#d7d7d7;

}

#next{

display:none;

margin-top:35px;

padding:15px 45px;

border:none;

border-radius:40px;

background:#38BDF8;

color:white;

font-size:18px;

cursor:pointer;

}

.flash{

position:fixed;

inset:0;

background:white;

opacity:0;

pointer-events:none;

}

</style>

</head>

<body>

<div id="stars"></div>

<div class="center">

<h1>Иногда...</h1>

<p>

Самое важное находится среди сотен обычных вещей.

<br><br>

Найди самую яркую звезду.

</p>

<button id="next">
Продолжить →
</button>

</div>

<div class="flash" id="flash"></div>

<script>

const stars=document.getElementById("stars");

// обычные звезды

for(let i=0;i<220;i++){

const s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*3+"s";

stars.appendChild(s);

}

// особенная звезда

const special=document.createElement("div");

special.className="star special";

special.style.left=(20+Math.random()*60)+"%";

special.style.top=(20+Math.random()*55)+"%";

stars.appendChild(special);

// клик

special.onclick=function(){

// сохранить прогресс

localStorage.setItem("foundStar","true");

// вспышка

const flash=document.getElementById("flash");

flash.style.transition=".2s";

flash.style.opacity="1";

setTimeout(()=>{

flash.style.opacity="0";

},250);

// убрать звезду

special.remove();

// изменить текст

document.querySelector("h1").innerHTML="Отлично.";

document.querySelector("p").innerHTML=

"Иногда нужно лишь немного терпения,<br><br>чтобы найти именно то, что искал.";

document.getElementById("next").style.display="inline-block";

}

document.getElementById("next").onclick=function(){

location.href="constellation.html";

}

</script>

</body>
</html>
