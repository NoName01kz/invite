<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Приглашение ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;
background:#050816;

display:flex;
justify-content:center;
align-items:center;

color:white;
overflow:hidden;

}


#stars{

position:fixed;
width:100%;
height:100%;

}



.star{

position:absolute;

width:2px;
height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{opacity:.2}

to{opacity:1}

}

.secret{

margin-top:30px;

padding:25px;

background:rgba(255,255,255,.06);

border-radius:25px;

}



#closedLetter{

font-size:60px;

animation:float 2s infinite alternate;

}


#closedLetter h2{

font-size:20px;

margin-top:15px;

}



@keyframes float{

from{

transform:translateY(0);

}

to{

transform:translateY(-12px);

}

}



#letter{

margin-top:25px;

padding:25px;

background:rgba(56,189,248,.12);

border-radius:20px;

font-size:20px;

line-height:32px;

}



.typing{

border-right:2px solid white;

animation:cursor .7s infinite;

}



@keyframes cursor{

50%{

border-color:transparent;

}

}
.typing::after{

content:"|";

animation:blink .7s infinite;

}


@keyframes blink{

0%,100%{

opacity:1;

}

50%{

opacity:0;

}

}
.card{

width:min(92%,500px);

padding:40px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

backdrop-filter:blur(20px);

text-align:center;

box-shadow:0 0 50px rgba(56,189,248,.2);

}



h1{

font-size:38px;

margin-bottom:20px;

}



.text{

font-size:20px;

line-height:32px;

color:#dbeafe;

}



.box{

margin-top:25px;

padding:20px;

background:rgba(255,255,255,.08);

border-radius:20px;

}



.place{

font-size:24px;

color:#38BDF8;

margin-top:15px;

}



.timer{

margin-top:25px;

font-size:22px;

color:#38BDF8;

}



.secret{

margin-top:30px;

padding:20px;

background:rgba(56,189,248,.12);

border-radius:20px;

}



button{

margin-top:15px;

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#38BDF8;

color:white;

font-size:17px;

cursor:pointer;

}



.hidden{

display:none;

}



#letter{

margin-top:20px;

padding:25px;

background:rgba(255,255,255,.1);

border-radius:20px;

animation:open .8s;

font-size:20px;

line-height:30px;

}



@keyframes open{

from{

opacity:0;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1);

}

}



</style>

</head>


<body>



<div id="stars"></div>



<div class="card">


<h1>
❤️ Приглашение
</h1>



<div class="text">

Я хочу провести этот день вместе с тобой ✨

</div>




<div class="box">


<div>

📅

<span id="date">...</span>

</div>


<div style="margin-top:10px">

🕒

<span id="time">...</span>

</div>


</div>




<div class="box">


<div>

Наш план:

</div>


<div class="place" id="place">

Загрузка...

</div>


</div>





<div class="timer">


⏳

<div id="meetingTimer">

...

</div>


</div>






<div class="secret">


<div id="closedLetter">

💌

<h2>
У тебя есть секретное письмо
</h2>

</div>



<div id="secretTimer">

Проверка...

</div>



<button id="openSecret" class="hidden">

💙 Открыть письмо

</button>




<div id="letter" class="hidden">

</div>



</div>





<script type="module">


import {

loadUser,

updateUser

} from "./user.js";





// звезды


const stars=document.getElementById("stars");


for(let i=0;i<180;i++){


let s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";


stars.appendChild(s);


}





let user;



function formatPlace(place){


if(!place) return "Сюрприз ❤️";


if(place.includes("Кино"))

return "🎬 Кино ❤️";


if(place.includes("Прогулка"))

return "🚶 Прогулка ❤️";


if(place.includes("Кафе"))

return "☕ Кафе ❤️";


if(place.includes("Дом"))

return "🏠 Уютный вечер ❤️";


return place;


}






function timer(target,id,callback){


let interval=setInterval(()=>{


let now=new Date().getTime();


let diff=new Date(target).getTime()-now;



if(diff<=0){


clearInterval(interval);


document.getElementById(id).innerHTML="❤️ Сейчас";


if(callback) callback();


return;

}



let d=Math.floor(diff/86400000);


let h=Math.floor(diff%86400000/3600000);


let m=Math.floor(diff%3600000/60000);


let s=Math.floor(diff%60000/1000);



document.getElementById(id).innerHTML=

`${d}д ${h}ч ${m}м ${s}с`;



},1000);


}






async function start(){



user=await loadUser();



if(!user){

return;

}





document.getElementById("place").innerHTML=

formatPlace(user.selectedPlace);



document.getElementById("date").innerHTML=

user.selectedDate || "-";


document.getElementById("time").innerHTML=

user.selectedTime || "-";





if(user.selectedDate && user.selectedTime){


timer(

user.selectedDate+"T"+user.selectedTime,

"meetingTimer"

);


}






// секрет



if(user.secretDate){



timer(

user.secretDate,

"secretTimer",

()=>{


document.getElementById("openSecret")

.classList.remove("hidden");

}


);



}




document.getElementById("openSecret").onclick = async function(){

    const button = document.getElementById("openSecret");

    const letter = document.getElementById("letter");


    button.style.display = "none";


    document.getElementById("closedLetter").innerHTML = "💌✨";


    letter.classList.remove("hidden");

    letter.innerHTML = "";


    const message = user.secretMessage || 
    "Спасибо, что ты здесь ❤️";


    let index = 0;


    letter.classList.add("typing");


    const letters = [...message];


    const typing = setInterval(()=>{


        letter.innerHTML += letters[index];


        index++;


        if(index >= letters.length){


            clearInterval(typing);


            letter.classList.remove("typing");


        }


    },80);



    await updateUser({

        secretOpened:true

    });


};





}



start();



</script>


</body>

</html>
