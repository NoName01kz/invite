<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Приглашение ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}

body{

background:#050816;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;

}

/* ---------- ЗВЕЗДЫ ---------- */

#stars{

position:fixed;
inset:0;

}

.star{

position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:.5;
animation:blink 3s infinite alternate;

}

@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}

/* ---------- КАРТОЧКА ---------- */

.card{

width:min(92%,520px);

padding:40px;

border-radius:28px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(16px);

text-align:center;

box-shadow:0 0 45px rgba(56,189,248,.18);

animation:show .8s;

}

@keyframes show{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.icon{

font-size:70px;

margin-bottom:20px;

animation:float 3s infinite ease-in-out;

}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0);
}

}

h1{

font-size:34px;

margin-bottom:18px;

}

.text{

font-size:18px;

line-height:30px;

color:#d7d7d7;

margin-bottom:30px;

}

.info{

background:rgba(255,255,255,.06);

padding:18px;

border-radius:18px;

margin-bottom:25px;

}

.info h3{

margin-bottom:12px;

color:#7dd3fc;

}

.row{

margin:8px 0;

font-size:17px;

}

.timer{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:12px;

margin-top:25px;

}

.box{

background:rgba(255,255,255,.08);

padding:15px;

border-radius:16px;

}

.number{

font-size:28px;

font-weight:700;

}

.label{

font-size:13px;

color:#b8c3d0;

margin-top:5px;

}

.footer{

margin-top:30px;

font-size:15px;

color:#94a3b8;

}

</style>
</head>

<body>

<div id="stars"></div>

<div class="card">

<div class="icon">
💌
</div>

<h1>Приглашение</h1>

<div class="text">

Если ты видишь эту страницу,

значит дошла до самого конца.

<br><br>

И теперь я хочу пригласить тебя
на свидание ❤️

</div>

<div class="info">

<h3>Наша встреча</h3>

<div class="row">
📅 <span id="dateText">Загрузка...</span>
</div>

<div class="row">
🕒 <span id="timeText">--:--</span>
</div>

</div>

<h3 style="margin-bottom:15px;">
До встречи осталось
</h3>

<div class="timer">

<div class="box">
<div class="number" id="days">0</div>
<div class="label">Дней</div>
</div>

<div class="box">
<div class="number" id="hours">0</div>
<div class="label">Часов</div>
</div>

<div class="box">
<div class="number" id="minutes">0</div>
<div class="label">Минут</div>
</div>

<div class="box">
<div class="number" id="seconds">0</div>
<div class="label">Секунд</div>
</div>

</div>

<div class="footer">

Спасибо, что прошла это небольшое путешествие ✨

</div>

</div>

<script>

// ---------- ЗВЁЗДЫ ----------

const stars=document.getElementById("stars");

for(let i=0;i<180;i++){

const s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*5+"s";

stars.appendChild(s);

}

// ↓↓↓ Во второй части добавим:
// • чтение даты из localStorage
// • живой таймер
// • автоматическое обновление каждую секунду
// ---------- ЗВЁЗДЫ ----------

const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {

    const s = document.createElement("div");

    s.className = "star";

    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";

    s.style.animationDelay = Math.random() * 5 + "s";

    stars.appendChild(s);
}

// ---------- ЧТЕНИЕ ДАТЫ ----------

const savedDate = localStorage.getItem("selectedDate");
const savedTime = localStorage.getItem("selectedTime");

if (!savedDate || !savedTime) {

    document.getElementById("dateText").innerHTML = "Дата не выбрана";
    document.getElementById("timeText").innerHTML = "--:--";

} else {

    const date = new Date(savedDate);

    document.getElementById("dateText").innerHTML =
        date.toLocaleDateString("ru-RU", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    document.getElementById("timeText").innerHTML = savedTime;

}

// ---------- ТАЙМЕР ----------

function updateTimer() {

    if (!savedDate || !savedTime) return;

    const target = new Date(savedDate + "T" + savedTime + ":00");

    const now = new Date();

    const diff = target - now;

    if (diff <= 0) {

        document.querySelector(".timer").innerHTML = `

        <div style="
            grid-column:1/5;
            font-size:28px;
            color:#7dd3fc;
            line-height:42px;
        ">

        🎉 Сегодня тот самый день!

        <br><br>

        Надеюсь, впереди вас ждёт прекрасный вечер ❤️

        </div>

        `;

        return;

    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
        (diff % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (diff % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    const seconds = Math.floor(
        (diff % (1000 * 60)) /
        1000
    );

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

}

updateTimer();

setInterval(updateTimer, 1000);

// ---------- ПАДАЮЩАЯ ЗВЕЗДА ----------

setInterval(() => {

    const star = document.createElement("div");

    star.style.position = "fixed";
    star.style.left = Math.random() * window.innerWidth + "px";
    star.style.top = "0px";
    star.style.width = "3px";
    star.style.height = "3px";
    star.style.background = "white";
    star.style.borderRadius = "50%";
    star.style.boxShadow = "0 0 20px white";
    star.style.zIndex = "999";

    document.body.appendChild(star);

    let x = 0;
    let y = 0;

    const fly = setInterval(() => {

        x += 12;
        y += 8;

        star.style.transform =
            `translate(${x}px,${y}px)`;

        if (y > window.innerHeight) {

            clearInterval(fly);

            star.remove();

        }

    }, 16);

}, 15000);
</script>

</body>
</html>
