<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Приглашение ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;

background:#050816;

display:flex;

justify-content:center;

align-items:center;

color:white;

overflow:hidden;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:min(92%,500px);

padding:40px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

backdrop-filter:blur(18px);

text-align:center;

box-shadow:0 0 50px rgba(56,189,248,.2);

animation:show 1s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



h1{

font-size:38px;

margin-bottom:25px;

}



.message{

font-size:20px;

line-height:32px;

color:#dbeafe;

margin-bottom:25px;

}



.info{

background:rgba(255,255,255,.08);

padding:20px;

border-radius:20px;

margin-top:20px;

}



.item{

margin:12px;

font-size:18px;

}



.heart{

font-size:40px;

animation:pulse 1.5s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.2);

}

}



</style>

</head>


<body>


<div id="stars"></div>



<div class="card">


<div class="heart">
❤️
</div>


<h1>
Для тебя
</h1>



<div class="message">

Я подготовил это приглашение специально для тебя ✨

</div>



<div class="info">


<div class="item">

📅 Дата:
<span id="date">
загрузка...
</span>

</div>



<div class="item">

🕒 Время:
<span id="time">
загрузка...
</span>

</div>



</div>



</div>




<script type="module">


import {

loadUser,

updateUser

} from "./user.js";



// Звезды

const stars=document.getElementById("stars");


for(let i=0;i<180;i++){


const s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";


s.style.animationDelay=Math.random()*5+"s";


stars.appendChild(s);


}




async function start(){



const user = await loadUser();



if(!user){

console.log("Пользователь не найден");

return;

}




document.getElementById("date").innerHTML =

user.selectedDate || "не выбрана";



document.getElementById("time").innerHTML =

user.selectedTime || "не выбрано";




// отметить открытие

await updateUser({

inviteOpened:true

});



}



start();



</script>



</body>

</html>
