<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Приглашение ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;

background:#050816;

display:flex;

justify-content:center;

align-items:center;

color:white;

overflow:hidden;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:min(92%,520px);

padding:40px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

backdrop-filter:blur(18px);

box-shadow:0 0 50px rgba(56,189,248,.2);

text-align:center;

animation:show 1s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



.heart{

font-size:45px;

animation:pulse 1.5s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.2);

}

}



h1{

font-size:36px;

margin:20px 0;

}



.text{

font-size:20px;

line-height:32px;

color:#dbeafe;

}



.info{

margin-top:25px;

padding:20px;

border-radius:20px;

background:rgba(255,255,255,.08);

}



.item{

margin:12px 0;

font-size:18px;

}



.answers{

margin-top:25px;

text-align:left;

background:rgba(255,255,255,.05);

padding:20px;

border-radius:20px;

}



.answers h3{

margin-bottom:15px;

}



.answer{

margin:10px 0;

color:#cbd5e1;

}



</style>

</head>



<body>


<div id="stars"></div>



<div class="card">


<div class="heart">
❤️
</div>



<h1>
Приглашение
</h1>



<div class="text">

Это приглашение создано специально для тебя ✨

</div>




<div class="info">


<div class="item">

📅 Дата:
<span id="date">...</span>

</div>


<div class="item">

🕒 Время:
<span id="time">...</span>

</div>


</div>




<div class="answers">

<h3>
Твои ответы 💫
</h3>


<div id="answersList">

Загрузка...

</div>


</div>



</div>





<script type="module">


import {

loadUser,

updateUser

} from "./user.js";




// Звезды


const stars=document.getElementById("stars");


for(let i=0;i<180;i++){


const s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";


s.style.animationDelay=Math.random()*5+"s";


stars.appendChild(s);


}





async function loadInvite(){



const user = await loadUser();



if(!user){


console.log("Нет пользователя");


return;


}





document.getElementById("date").innerHTML =

user.selectedDate || "Дата не выбрана";



document.getElementById("time").innerHTML =

user.selectedTime || "Время не выбрано";





const list=document.getElementById("answersList");



if(user.answers){


list.innerHTML="";


Object.values(user.answers).forEach((answer,index)=>{


list.innerHTML +=

`

<div class="answer">

${index+1}. ${answer}

</div>

`;


});


}

else{


list.innerHTML="Ответов пока нет";


}




await updateUser({

inviteOpened:true

});



}



loadInvite();



</script>



</body>

</html>
