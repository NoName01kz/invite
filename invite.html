<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Приглашение ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;

background:#050816;

display:flex;

justify-content:center;

align-items:center;

color:white;

overflow:hidden;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}


@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:min(92%,520px);

padding:40px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

backdrop-filter:blur(18px);

box-shadow:0 0 50px rgba(56,189,248,.2);

text-align:center;

}



.heart{

font-size:55px;

animation:pulse 1.5s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.15);

}

}



h1{

margin:20px 0;

font-size:36px;

}



.text{

color:#dbeafe;

font-size:18px;

line-height:30px;

}



.info{

margin-top:25px;

padding:20px;

background:rgba(255,255,255,.08);

border-radius:20px;

}



.item{

margin:10px;

font-size:18px;

}



.timer{

margin-top:25px;

padding:25px;

border-radius:20px;

background:rgba(56,189,248,.12);

}



.timer h2{

font-size:22px;

margin-bottom:15px;

}



#countdown{

font-size:25px;

color:#38BDF8;

font-weight:600;

}



.answers{

margin-top:25px;

padding:20px;

background:rgba(255,255,255,.05);

border-radius:20px;

text-align:left;

}



.answer{

margin:10px 0;

color:#cbd5e1;

}



#status{

margin-top:15px;

color:#7dd3fc;

}


</style>


</head>


<body>


<div id="stars"></div>



<div class="card">


<div class="heart">
❤️
</div>


<h1>
Приглашение
</h1>



<div class="text">

Это место создано специально для тебя ✨

</div>



<div class="info">


<div class="item">

📅 
<span id="date">
...
</span>

</div>


<div class="item">

🕒 
<span id="time">
...
</span>

</div>


</div>




<div class="timer">


<h2>
⏳ До встречи осталось
</h2>


<div id="countdown">

Загрузка...

</div>


</div>





<div class="answers">


<h3>
Твои ответы 💫
</h3>


<div id="answersList">

Загрузка...

</div>


</div>



<div id="status"></div>


</div>





<script type="module">


import {

loadUser,

updateUser

} from "./user.js";





// звезды


const stars=document.getElementById("stars");


for(let i=0;i<200;i++){


const s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";


s.style.animationDelay=Math.random()*5+"s";


stars.appendChild(s);


}






function startTimer(date,time){


const target = new Date(
date+"T"+time
).getTime();



const timer=setInterval(()=>{


const now=new Date().getTime();


const distance=target-now;



if(distance<=0){


document.getElementById("countdown").innerHTML=

"❤️ Время встречи наступило";


clearInterval(timer);


return;

}



const days=Math.floor(
distance/(1000*60*60*24)
);



const hours=Math.floor(
(distance%(1000*60*60*24))
/(1000*60*60)
);



const minutes=Math.floor(
(distance%(1000*60*60))
/(1000*60)
);



const seconds=Math.floor(
(distance%(1000*60))
/1000
);



document.getElementById("countdown").innerHTML=

`
${days} дней<br>
${hours} часов 
${minutes} минут 
${seconds} секунд
`;



},1000);


}





async function openInvite(){


try{


const user=await loadUser();



if(!user){


document.getElementById("status").innerHTML=

"Пользователь не найден";


return;


}




document.getElementById("date").innerHTML=

user.selectedDate || "Нет";



document.getElementById("time").innerHTML=

user.selectedTime || "Нет";





if(user.selectedDate && user.selectedTime){


startTimer(

user.selectedDate,

user.selectedTime

);


}





const list=document.getElementById("answersList");



if(user.answers && user.answers.length){


list.innerHTML="";


user.answers.forEach((a,i)=>{


list.innerHTML+=`

<div class="answer">

${i+1}. ${a}

</div>

`;


});


}

else{


list.innerHTML="Ответов нет";


}




await updateUser({

inviteOpened:true

});



document.getElementById("status").innerHTML=

"Приглашение открыто ✨";



}

catch(e){


console.log(e);


document.getElementById("status").innerHTML=

"Ошибка загрузки";


}


}



openInvite();



</script>


</body>

</html>
