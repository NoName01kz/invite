<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Приглашение ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;

background:#050816;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:white;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}




.card{

width:min(92%,520px);

padding:40px;

text-align:center;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

backdrop-filter:blur(18px);

box-shadow:0 0 50px rgba(56,189,248,.2);

animation:show .8s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}



.heart{

font-size:55px;

animation:pulse 1.5s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.15);

}

}



h1{

font-size:36px;

margin:20px 0;

}



.message{

font-size:21px;

line-height:32px;

color:#dbeafe;

}



.box{

margin-top:25px;

padding:20px;

border-radius:20px;

background:rgba(255,255,255,.08);

}



.item{

font-size:18px;

margin:12px;

}



.place{

margin-top:25px;

padding:25px;

background:rgba(56,189,248,.12);

border-radius:20px;

}



.place h2{

font-size:22px;

margin-bottom:15px;

}



#placeText{

font-size:24px;

color:#38BDF8;

font-weight:600;

}



.timer{

margin-top:25px;

padding:25px;

border-radius:20px;

background:rgba(56,189,248,.12);

}



.timer h2{

font-size:22px;

margin-bottom:15px;

}



#countdown{

font-size:24px;

color:#38BDF8;

font-weight:600;

}



#status{

margin-top:20px;

color:#7dd3fc;

}


</style>


</head>



<body>



<div id="stars"></div>




<div class="card">


<div class="heart">

❤️

</div>



<h1>

Приглашение

</h1>




<div class="message">

Я хочу провести этот день вместе с тобой ✨

</div>





<div class="place">


<h2>

Наш план

</h2>


<div id="placeText">

Загрузка...

</div>


</div>






<div class="box">


<div class="item">

📅

<span id="date">

-

</span>

</div>



<div class="item">

🕒

<span id="time">

-

</span>

</div>


</div>





<div class="timer">


<h2>

⏳ До встречи осталось

</h2>


<div id="countdown">

Загрузка...

</div>


</div>



<div id="status"></div>



</div>






<script type="module">


import {

loadUser,

updateUser

} from "./user.js";





// звезды


const stars=document.getElementById("stars");



for(let i=0;i<200;i++){


const star=document.createElement("div");


star.className="star";


star.style.left=Math.random()*100+"%";


star.style.top=Math.random()*100+"%";


star.style.animationDelay=Math.random()*5+"s";


stars.appendChild(star);


}






function createPlaceText(place){



if(!place){

return "Сюрприз ❤️";

}



if(place.includes("Кино")){


return "🎬 Я приглашаю тебя в кино ❤️";


}



if(place.includes("Прогулка")){


return "🚶 Я приглашаю тебя на прогулку ❤️";


}



if(place.includes("Дом")){


return "🏠 Я приглашаю тебя на уютный вечер ❤️";


}



if(place.includes("Кафе")){


return "☕ Я приглашаю тебя в кафе ❤️";


}



return place;


}







function startTimer(date,time){



const target=new Date(

date+"T"+time

).getTime();




const interval=setInterval(()=>{



const now=new Date().getTime();



const distance=target-now;




if(distance<=0){



document.getElementById("countdown").innerHTML=

"❤️ Время встречи наступило";



clearInterval(interval);


return;


}





const days=Math.floor(

distance/(1000*60*60*24)

);



const hours=Math.floor(

(distance%(1000*60*60*24))

/(1000*60*60)

);



const minutes=Math.floor(

(distance%(1000*60*60))

/(1000*60)

);



const seconds=Math.floor(

(distance%(1000*60))

/1000

);




document.getElementById("countdown").innerHTML=

`

${days} дней<br>

${hours} часов

${minutes} минут

${seconds} секунд

`;





},1000);


}








async function loadInvite(){


try{



const user=await loadUser();




if(!user){


document.getElementById("status").innerHTML=

"Пользователь не найден";


return;


}





document.getElementById("placeText").innerHTML=

createPlaceText(user.selectedPlace);





document.getElementById("date").innerHTML=

user.selectedDate || "Не выбрано";





document.getElementById("time").innerHTML=

user.selectedTime || "Не выбрано";





if(user.selectedDate && user.selectedTime){


startTimer(

user.selectedDate,

user.selectedTime

);


}





await updateUser({

inviteOpened:true

});




document.getElementById("status").innerHTML=

"Приглашение открыто ✨";



}

catch(e){


console.log(e);


document.getElementById("status").innerHTML=

"Ошибка загрузки";


}


}



loadInvite();



</script>


</body>

</html>
