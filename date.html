<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Выбор даты ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;

background:#050816;

display:flex;

justify-content:center;

align-items:center;

color:white;

overflow:hidden;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:min(92%,420px);

padding:35px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

border-radius:25px;

backdrop-filter:blur(15px);

box-shadow:0 0 35px rgba(56,189,248,.2);

}



h1{

text-align:center;

margin-bottom:15px;

}



p{

text-align:center;

color:#cbd5e1;

line-height:25px;

margin-bottom:25px;

}



label{

display:block;

margin-top:15px;

margin-bottom:8px;

color:#94a3b8;

}



input{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

outline:none;

}



button{

width:100%;

margin-top:30px;

padding:16px;

border:none;

border-radius:15px;

background:#38BDF8;

color:white;

font-size:18px;

cursor:pointer;

}



button:hover{

box-shadow:0 0 20px #38BDF8;

}



#status{

margin-top:15px;

text-align:center;

color:#7dd3fc;

}


</style>


</head>


<body>


<div id="stars"></div>



<div class="card">


<h1>
Последний шаг ✨
</h1>


<p>
Выбери день и время встречи ❤️
</p>



<label>
📅 Дата
</label>


<input 
type="date"
id="date">



<label>
🕒 Время
</label>


<input 
type="time"
id="time"
value="18:00">



<button onclick="saveDate()">

Подтвердить ❤️

</button>


<div id="status"></div>


</div>





<script type="module">


import {

updateUser

} from "./user.js";





// звезды


const stars=document.getElementById("stars");


for(let i=0;i<200;i++){


const s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";


s.style.animationDelay=Math.random()*5+"s";


stars.appendChild(s);


}






// запрет прошлых дат


const today =
new Date().toISOString().split("T")[0];


document.getElementById("date").min=today;





window.saveDate = async function(){



const date =
document.getElementById("date").value;



const time =
document.getElementById("time").value;



const status =
document.getElementById("status");




if(!date){


alert("Выбери дату ❤️");


return;


}



try{



status.innerHTML="Сохранение...";



await updateUser({

selectedDate: date,

selectedTime: time,

completed:true

});



status.innerHTML="Готово ✨";



setTimeout(()=>{


window.location="invite.html";


},1000);



}

catch(e){


console.log(e);


status.innerHTML="Ошибка сохранения";


}



}



</script>


</body>

</html>
