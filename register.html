<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Регистрация ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;

background:#050816;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:white;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:380px;

padding:40px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

border-radius:25px;

backdrop-filter:blur(15px);

box-shadow:0 0 35px rgba(56,189,248,.2);

text-align:center;

}



h2{

margin-bottom:25px;

}



input{

width:100%;

padding:15px;

margin-bottom:15px;

border:none;

border-radius:12px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

outline:none;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#38BDF8;

color:white;

font-size:17px;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:scale(1.03);

box-shadow:0 0 20px #38BDF8;

}



#error{

color:#ff7777;

margin-top:15px;

}



.link{

margin-top:20px;

color:#94a3b8;

cursor:pointer;

}


</style>


</head>


<body>


<div id="stars"></div>



<div class="card">


<h2>
Создать доступ ✨
</h2>



<input 
id="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Пароль">



<button onclick="register()">

Создать аккаунт

</button>



<div id="error"></div>



<div class="link" onclick="location.href='login.html'">

Уже есть аккаунт? Войти

</div>


</div>





<script type="module">


import {

auth

} from "./firebase.js";


import {

createUserWithEmailAndPassword

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";


import {

createUser

} from "./user.js";





// Звезды

const stars=document.getElementById("stars");


for(let i=0;i<200;i++){


const s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";


s.style.animationDelay=Math.random()*5+"s";


stars.appendChild(s);


}





window.register = async function(){



const email =
document.getElementById("email").value.trim();



const password =
document.getElementById("password").value;



const error =
document.getElementById("error");



error.innerHTML="";



if(!email || !password){


error.innerHTML="Заполни все поля";


return;

}



if(password.length < 6){


error.innerHTML="Пароль минимум 6 символов";


return;

}




try{


await createUserWithEmailAndPassword(

auth,

email,

password

);



await createUser();



alert("Аккаунт создан ❤️");



location.href="questions.html";



}

catch(e){


console.log(e);



if(e.code==="auth/email-already-in-use"){


error.innerHTML="Этот Email уже зарегистрирован";


}

else if(e.code==="auth/invalid-email"){


error.innerHTML="Неверный Email";


}

else{


error.innerHTML="Ошибка регистрации";


}


}



}



</script>


</body>

</html>
