<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админ панель</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

background:#050816;
color:white;
padding:30px;

}


.container{

max-width:900px;
margin:auto;

}


h1{

text-align:center;
margin-bottom:30px;

}


.panel{

background:rgba(255,255,255,.06);

padding:25px;

border-radius:20px;

margin-bottom:30px;

}



input,textarea,select{

width:100%;

padding:15px;

margin-top:10px;

margin-bottom:15px;

border:none;

border-radius:12px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

}



textarea{

height:120px;

resize:none;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#38BDF8;

color:white;

font-size:17px;

cursor:pointer;

}



.user{

background:rgba(255,255,255,.06);

border-radius:20px;

padding:25px;

margin-bottom:20px;

}



.title{

color:#38BDF8;

font-size:22px;

}



.item{

margin-top:10px;

}



.answers{

margin-top:15px;

padding:15px;

background:rgba(255,255,255,.05);

border-radius:15px;

}



#status{

color:#7dd3fc;

margin-top:15px;

}


</style>

</head>


<body>


<div class="container">


<h1>
✨ StarInvite Admin
</h1>



<div class="panel">


<h2>
💌 Секретное сообщение
</h2>



<select id="userSelect">

<option>
Выберите пользователя
</option>

</select>



<textarea id="secretMessage"
placeholder="Текст секретного сообщения...">
</textarea>



<label>
Дата открытия
</label>


<input type="date" id="secretDate">



<label>
Время открытия
</label>


<input type="time" id="secretTime" value="20:00">



<button onclick="saveSecret()">

Сохранить секрет ❤️

</button>


<div id="status"></div>


</div>





<div id="users">

Загрузка...

</div>



</div>






<script type="module">


import {

db

} from "./firebase.js";


import {

collection,

getDocs,

doc,

setDoc

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";



const usersBox=document.getElementById("users");

const select=document.getElementById("userSelect");



let users=[];




async function loadUsers(){



const snapshot=await getDocs(

collection(db,"users")

);



usersBox.innerHTML="";



snapshot.forEach(item=>{


const user=item.data();



users.push({

id:item.id,

data:user

});



select.innerHTML += `

<option value="${item.id}">

${item.id}

</option>

`;





usersBox.innerHTML += `

<div class="user">


<div class="title">

👤 ${item.id}

</div>


<div class="item">

📅 Встреча:
${user.selectedDate || "нет"}

</div>


<div class="item">

🕒 Время:
${user.selectedTime || "нет"}

</div>



<div class="item">

🔓 Приглашение:
${user.inviteOpened ? "открыто" : "закрыто"}

</div>



<div class="answers">

<b>Ответы:</b>

<br><br>

${JSON.stringify(user.answers || {})}

</div>


</div>

`;



});


}



window.saveSecret=async()=>{


const id=select.value;


if(id==="Выберите пользователя"){

alert("Выбери пользователя");

return;

}



const message=document.getElementById("secretMessage").value;


const date=document.getElementById("secretDate").value;


const time=document.getElementById("secretTime").value;



await setDoc(

doc(db,"users",id),

{


secretMessage:message,


secretDate:

date+"T"+time,


secretOpened:false


},

{

merge:true

}



);



document.getElementById("status").innerHTML=

"✅ Секрет сохранён";



};




loadUsers();



</script>


</body>

</html>
