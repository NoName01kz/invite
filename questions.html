<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вопросы ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

background:#050816;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:white;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

opacity:.5;

animation:blink 3s infinite alternate;

}


@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:min(92%,470px);

padding:35px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

border-radius:25px;

backdrop-filter:blur(15px);

box-shadow:0 0 35px rgba(56,189,248,.2);

}



.progress{

color:#7dd3fc;

margin-bottom:15px;

}



.bar{

height:8px;

background:rgba(255,255,255,.1);

border-radius:20px;

overflow:hidden;

margin-bottom:30px;

}



.fill{

height:100%;

width:20%;

background:#38BDF8;

transition:.4s;

}



h2{

font-size:27px;

line-height:38px;

margin-bottom:20px;

}



textarea{

width:100%;

height:130px;

padding:15px;

border:none;

border-radius:15px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

outline:none;

}



.answer{

width:100%;

margin-top:12px;

padding:15px;

border:none;

border-radius:15px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

cursor:pointer;

}



.answer.active{

background:#38BDF8;

}



.next{

margin-top:30px;

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:#38BDF8;

color:white;

font-size:18px;

cursor:pointer;

}



</style>

</head>



<body>


<div id="stars"></div>



<div class="card">


<div class="progress">

Вопрос <span id="number">1</span> из 5

</div>


<div class="bar">

<div class="fill" id="fill"></div>

</div>



<h2 id="question"></h2>



<div id="answers"></div>



<button class="next" onclick="nextQuestion()">

Далее →

</button>


</div>




<script type="module">


import {

updateUser

} from "./user.js";




// Звезды


const stars=document.getElementById("stars");


for(let i=0;i<180;i++){


const s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";


s.style.animationDelay=Math.random()*4+"s";


stars.appendChild(s);


}





const questions=[


{

type:"text",

question:"Что делает день для тебя по-настоящему хорошим?"

},


{

type:"choice",

question:"Какой вечер нравится больше?",

answers:[

"🌅 Закат",

"☕ Кафе",

"🎬 Кино",

"🚶 Прогулка"

]

},


{

type:"choice",

question:"Что выберешь?",

answers:[

"☕ Кофе",

"🍵 Чай",

"🧃 Сок",

"🥤 Лимонад"

]

},


{

type:"text",

question:"Есть ли место, куда ты давно хотела сходить?"

},


{

type:"choice",

question:"Что важнее всего на первом свидании?",

answers:[

"😊 Разговор",

"😂 Смех",

"🌇 Атмосфера",

"🍰 Еда"

]

}


];



let current=0;


const answers=[];



function render(){



number.innerHTML=current+1;



fill.style.width=

((current+1)/questions.length*100)+"%";



question.innerHTML=

questions[current].question;



const box=document.getElementById("answers");


box.innerHTML="";




if(questions[current].type==="text"){



box.innerHTML=

`

<textarea id="textAnswer"></textarea>

`;



}



else{



questions[current].answers.forEach(a=>{



box.innerHTML+=

`

<button class="answer"

onclick="choose(this,'${a}')">

${a}

</button>

`;



});



}



}



window.choose=function(btn,value){



document.querySelectorAll(".answer")

.forEach(b=>b.classList.remove("active"));



btn.classList.add("active");


btn.dataset.value=value;



};





window.nextQuestion=async function(){



let answer;



if(questions[current].type==="text"){



answer=document.getElementById("textAnswer").value;



if(!answer){

alert("Напиши ответ ❤️");

return;

}



}

else{


const selected=document.querySelector(".answer.active");



if(!selected){

alert("Выбери вариант ❤️");

return;

}



answer=selected.dataset.value;


}




answers.push(answer);



current++;



if(current>=questions.length){



await updateUser({

answers:answers

});



await updateUser({

completed:true

});



location.href="date.html";


return;


}



render();



}




render();



</script>



</body>

</html>
