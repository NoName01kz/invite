<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Несколько вопросов</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}


body{

background:#050816;

overflow:hidden;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

color:white;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

opacity:.5;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:min(92%,470px);

padding:35px;

border-radius:24px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(15px);

box-shadow:0 0 35px rgba(56,189,248,.18);

animation:fade .8s;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}



.progress{

font-size:14px;

color:#7dd3fc;

margin-bottom:15px;

}



.bar{

height:8px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:30px;

}



.fill{

height:100%;

width:20%;

background:#38BDF8;

transition:.5s;

}



h2{

font-size:28px;

line-height:38px;

margin-bottom:25px;

}



textarea{

width:100%;

height:140px;

resize:none;

padding:18px;

border:none;

outline:none;

border-radius:16px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

}



.option{

width:100%;

padding:16px;

margin-top:12px;

border:none;

border-radius:16px;

background:rgba(255,255,255,.08);

color:white;

font-size:17px;

cursor:pointer;

transition:.3s;

}



.option.active{

background:#38BDF8;

}



.next{

margin-top:30px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:#38BDF8;

color:white;

font-size:18px;

cursor:pointer;

}



</style>

</head>


<body>


<div id="stars"></div>


<div class="card">


<div class="progress">

Вопрос <span id="number">1</span> из 5

</div>


<div class="bar">

<div class="fill" id="fill"></div>

</div>



<h2 id="question"></h2>


<div id="answers"></div>


<button class="next" onclick="nextQuestion()">

Далее →

</button>


</div>





<script type="module">


import {

updateUser

} from "./user.js";



const stars=document.getElementById("stars");



for(let i=0;i<180;i++){


const s=document.createElement("div");


s.className="star";


s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";


s.style.animationDelay=Math.random()*4+"s";


stars.appendChild(s);


}





const questions=[


{

type:"text",

question:"Что делает день для тебя по-настоящему хорошим?"

},



{

type:"choice",

question:"Куда ты хотела бы сходить?",

answers:[

"🎬 Кино",

"🚶 Прогулка",

"🏠 Домашний вечер",

"☕ Кафе"

]

},



{

type:"choice",

question:"Что выберешь?",

answers:[

"☕ Кофе",

"🍵 Чай",

"🧃 Сок",

"🥤 Лимонад"

]

},



{

type:"text",

question:"Есть ли место, куда ты давно хотела сходить?"

},



{

type:"choice",

question:"Что важнее всего на встрече?",

answers:[

"😊 Разговор",

"😂 Смех",

"🌇 Атмосфера",

"🍰 Еда"

]

}



];





let current=0;


let userAnswers=[];


let selectedPlace="";





function render(){


document.getElementById("number").innerHTML=current+1;


document.getElementById("fill").style.width=

((current+1)/questions.length*100)+"%";



document.getElementById("question").innerHTML=

questions[current].question;



const box=document.getElementById("answers");


box.innerHTML="";





if(questions[current].type==="text"){


box.innerHTML=`

<textarea id="answer"></textarea>

`;



}

else{


questions[current].answers.forEach(a=>{


box.innerHTML+=`

<button class="option" onclick="selectOption(this,'${a}')">

${a}

</button>

`;


});


}



}





window.selectOption=function(btn,value){


document.querySelectorAll(".option").forEach(b=>{


b.classList.remove("active");


});


btn.classList.add("active");


btn.dataset.value=value;



};







window.nextQuestion=async function(){



let answer="";



if(questions[current].type==="text"){


answer=document.getElementById("answer").value;


}

else{


const selected=document.querySelector(".option.active");



if(!selected){


alert("Выбери вариант ❤️");

return;


}



answer=selected.dataset.value;


}






userAnswers.push(answer);




// второй вопрос = место встречи

if(current===1){


selectedPlace=answer;


}



current++;





if(current>=questions.length){



await updateUser({

selectedPlace:selectedPlace,

answers:userAnswers

});



location.href="date.html";


return;


}



render();



}




render();


</script>



</body>

</html>
