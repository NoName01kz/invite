<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вопросы ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;

background:#050816;

display:flex;

justify-content:center;

align-items:center;

color:white;

overflow:hidden;

}



#stars{

position:fixed;

width:100%;

height:100%;

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

animation:blink 3s infinite alternate;

}



@keyframes blink{

from{
opacity:.2;
}

to{
opacity:1;
}

}



.card{

width:min(92%,470px);

padding:35px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

border-radius:25px;

backdrop-filter:blur(15px);

box-shadow:0 0 35px rgba(56,189,248,.2);

}



.progress{

color:#7dd3fc;

margin-bottom:20px;

}



.bar{

height:8px;

background:rgba(255,255,255,.1);

border-radius:20px;

overflow:hidden;

margin-bottom:30px;

}



.fill{

height:100%;

background:#38BDF8;

transition:.5s;

}



h2{

font-size:26px;

line-height:35px;

margin-bottom:25px;

}



textarea{

width:100%;

height:130px;

padding:15px;

border:none;

border-radius:15px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

}



.answer{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:15px;

background:rgba(255,255,255,.08);

color:white;

cursor:pointer;

}



.answer.active{

background:#38BDF8;

}



.next{

margin-top:25px;

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:#38BDF8;

color:white;

font-size:18px;

cursor:pointer;

}



</style>

</head>


<body>


<div id="stars"></div>



<div class="card">


<div class="progress">

Вопрос <span id="num">1</span> из 5

</div>


<div class="bar">

<div class="fill" id="fill"></div>

</div>



<h2 id="question"></h2>



<div id="answers"></div>



<button class="next" onclick="nextQuestion()">

Далее →

</button>


</div>





<script type="module">


import {

updateUser

} from "./user.js";





// звезды


const stars=document.getElementById("stars");


for(let i=0;i<200;i++){


const s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

stars.appendChild(s);


}






const questions=[


{

type:"text",

text:"Что делает день для тебя по-настоящему хорошим?"

},


{

type:"choice",

text:"Какой вечер нравится больше?",

answers:[

"🌅 Закат",

"☕ Кафе",

"🎬 Кино",

"🚶 Прогулка"

]

},


{

type:"choice",

text:"Что выберешь?",

answers:[

"☕ Кофе",

"🍵 Чай",

"🧃 Сок",

"🥤 Лимонад"

]

},


{

type:"text",

text:"Есть ли место, куда давно хотела сходить?"

},


{

type:"choice",

text:"Что важнее всего?",

answers:[

"😊 Разговор",

"😂 Смех",

"🌇 Атмосфера",

"🍰 Еда"

]

}


];



let current=0;


let answers=[];



const question=document.getElementById("question");

const answerBox=document.getElementById("answers");





function render(){


document.getElementById("num").innerHTML=current+1;


document.getElementById("fill").style.width=

((current+1)/questions.length*100)+"%";



question.innerHTML=questions[current].text;


answerBox.innerHTML="";



if(questions[current].type==="text"){


answerBox.innerHTML=`

<textarea id="textAnswer"></textarea>

`;


}

else{


questions[current].answers.forEach(a=>{


let btn=document.createElement("button");


btn.className="answer";


btn.innerHTML=a;



btn.onclick=()=>{


document.querySelectorAll(".answer")

.forEach(x=>x.classList.remove("active"));



btn.classList.add("active");


btn.dataset.selected=a;


};



answerBox.appendChild(btn);


});


}



}





window.nextQuestion=async function(){



let value="";



if(questions[current].type==="text"){


value=document.getElementById("textAnswer").value;



if(!value){

alert("Напиши ответ ❤️");

return;

}


}

else{


let selected=document.querySelector(".answer.active");


if(!selected){

alert("Выбери вариант ❤️");

return;

}



value=selected.dataset.selected;


}




answers.push(value);



current++;





if(current>=questions.length){



await updateUser({

answers:answers

});



window.location="date.html";


return;


}



render();



}





render();



</script>



</body>

</html>
